name: Absensi Otomatis Daily

on:
  schedule:
    # Menggunakan format Cron UTC. 
    # Jam 00:00 UTC sama dengan Jam 07:00 WIB (Pagi)
    # Jalani setiap hari Senin sampai Jumat (M-F)
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # Tombol manual agar bisa ditest kapan saja

jobs:
  absen:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repositori
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup lingkungan Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Install library yang dibutuhkan
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Jalankan skrip absensi
    - name: Run Attendance Script
      run: python absensi.py

    # 5. Simpan dan push perubahan kembali ke GitHub
    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add absensi.md
        git commit -m "Sistem: Absensi otomatis tanggal $(date +'%Y-%m-%d')" || exit 0
        git push
